<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TabTiler Layout</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #0f172a;
      overflow: hidden;
    }
    #grid {
      display: grid;
      width: 100%;
      height: 100%;
      gap: 2px;
      background-color: #1e293b;
    }
    .duo {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr;
    }
    .quad {
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
    }
    .paneContainer {
      position: relative;
      width: 100%;
      height: 100%;
      background-color: #0f172a;
      overflow: hidden;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      transform-origin: 0 0;
    }
  </style>
</head>
<body>
  <div id="grid"></div>
  <script src="layout.js"></script>
</body>
</html>
