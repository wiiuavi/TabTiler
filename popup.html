<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    body {
      width: 360px;
      background-color: #0f172a;
      color: #f8fafc;
      font-family: ui-sans-serif, system-ui, sans-serif;
      padding: 16px;
      margin: 0;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .title {
      font-size: 1.25rem;
      font-weight: bold;
      color: #38bdf8;
      margin: 0;
    }
    .dashBtn {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.75rem;
      font-weight: 500;
      transition: all 0.2s;
    }
    .dashBtn:hover { background: #334155; color: white; }
    .sectionTitle {
      font-size: 0.875rem;
      font-weight: 600;
      margin: 0 0 12px 0;
      color: #cbd5e1;
    }
    .hidden { display: none !important; }
    .inputField {
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      color: white;
      padding: 8px 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      font-size: 0.875rem;
    }
    .tabContainer {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-height: 180px;
      overflow-y: auto;
      margin-bottom: 16px;
      padding-right: 4px;
    }
    .tabWrapper {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px;
      border-radius: 8px;
      cursor: pointer;
      background-color: #1e293b;
      border: 1px solid transparent;
    }
    .tabWrapper:hover { border-color: #334155; }
    .tabCheckbox { accent-color: #0ea5e9; }
    .tabTitle { font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
    .primaryBtn {
      width: 100%;
      background-color: #0ea5e9;
      color: #020617;
      font-weight: bold;
      padding: 10px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      transition: background-color 0.2s;
    }
    .primaryBtn:hover { background-color: #38bdf8; }
    .primaryBtn:disabled { opacity: 0.5; cursor: not-allowed; }
    .paneControlCard {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .paneHeader {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .paneName { font-size: 0.85rem; font-weight: 600; color: #38bdf8; }
    .paneActions { display: flex; gap: 4px; }
    .actionBtn {
      background: #334155;
      border: none;
      color: white;
      border-radius: 4px;
      padding: 5px 8px;
      cursor: pointer;
      font-size: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .actionBtn:hover { background: #475569; }
    .actionBtn.closeBtn { color: #f87171; }
    .actionBtn.closeBtn:hover { background: #7f1d1d; color: white; }
    .warningText {
      font-size: 0.75rem;
      color: #fbbf24;
      background: rgba(251, 191, 36, 0.1);
      padding: 8px;
      border-radius: 6px;
      margin-bottom: 12px;
      border: 1px solid rgba(251, 191, 36, 0.2);
    }
    .slotInputGroup {
      display: flex;
      gap: 6px;
      width: 100%;
    }
    .slotInput {
      flex: 1;
      background: #0f172a;
      border: 1px solid #334155;
      color: white;
      padding: 6px 8px;
      border-radius: 4px;
      font-size: 0.75rem;
    }
    .zoomSelect {
      background: #0f172a;
      border: 1px solid #334155;
      color: white;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 0.7rem;
      margin-left: 6px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1 class="title">TabTiler</h1>
    <button id="openDashBtn" class="dashBtn">Dashboard</button>
  </div>

  <div id="createView" class="hidden">
    <h2 class="sectionTitle">New Layout</h2>
    <div class="warningText">⚠️ Tiling reloads tabs. Unsaved data will be lost!</div>
    <input type="text" id="layoutNameInput" class="inputField" placeholder="Layout Name (e.g., Minecraft Split)">
    <div id="tabContainer" class="tabContainer"></div>
    <button id="createLayoutBtn" class="primaryBtn">Select 2-4 Tabs</button>
  </div>

  <div id="manageView" class="hidden">
    <h2 class="sectionTitle" id="activeLayoutName">Active Layout</h2>
    <div id="panesContainer"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
